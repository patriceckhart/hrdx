name: release

# Every push to main that passes CI cuts a new release. The workflow:
#   1. waits for the ci workflow on the same commit to succeed
#   2. looks up the latest existing vX.Y.Z tag
#   3. bumps the patch number (vX.Y.Z+1) - or starts at v0.0.1 if none
#   4. creates and pushes that tag
#   5. runs goreleaser, which builds binaries for linux/darwin
#      (amd64 + arm64) and attaches them plus checksums.txt to a fresh
#      GitHub Release page
#   6. builds the desktop app (desktop/) on macOS, Windows, and Linux and
#      uploads a .dmg, a .zip, and a .tar.gz to the same release, each
#      with a desktop-checksums-<platform>.txt
#
# Skip a release by putting [release=skip] anywhere in the commit
# message - useful for docs-only or ci-only commits. We use a rare
# equals-sign form so commits that merely *mention* the feature
# ("make the release step optional") don't accidentally opt out.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  # Needed to create tags and to upload release archives.
  contents: write

# Only one release job at a time. If two pushes land in quick
# succession, queue them so they don't race on the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    outputs:
      tag: ${{ steps.bump.outputs.next }}
      version: ${{ steps.bump.outputs.version }}
    # Only run when ci succeeded and we're on main, and when the head
    # commit doesn't opt out via [release=skip].
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && !contains(github.event.workflow_run.head_commit.message, '[release=skip]') }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # Full history so we can read existing tags.
          fetch-depth: 0
          # Check out the exact sha that ci verified, not whatever the
          # branch tip happens to be at this moment (which may have
          # advanced since ci finished).
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: compute next version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          # Find the newest vX.Y.Z tag. If the repo has none yet, start
          # at v0.0.0 so the first release becomes v0.0.1.
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          echo "latest tag: $latest"

          # Strip the v prefix, split on dots, bump the patch.
          # After .99 roll over to the next minor (e.g. 0.0.99 -> 0.1.0,
          # 0.1.99 -> 0.2.0). Keep major fixed at 0 for now.
          ver="${latest#v}"
          IFS=. read -r major minor patch <<<"$ver"
          if [ "$patch" -ge 99 ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi
          next="v${major}.${minor}.${patch}"
          echo "next tag:   $next"

          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

      - name: create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.bump.outputs.next }}" \
            -m "release ${{ steps.bump.outputs.next }}"
          git push origin "${{ steps.bump.outputs.next }}"

      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          # goreleaser reads the tag we just pushed and builds binaries
          # for every (goos, goarch) combination in .goreleaser.yaml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The desktop app (hrdx.app) is built on each platform's own runner,
  # because Wails links the native webview. Assets are added to the release
  # goreleaser just published.
  desktop:
    needs: release
    name: desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            platform: darwin/universal
          - name: windows
            os: windows-latest
            platform: windows/amd64
          - name: linux
            os: ubuntu-22.04
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Step conditions can only see job-level env, so expose whether a
      # signing certificate is configured here.
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: set up bun
        uses: oven-sh/setup-bun@v2

      - name: webview packages (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: stamp version
        working-directory: desktop
        run: |
          # The bundle version (Info.plist, Windows file info) comes from wails.json.
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: build
        working-directory: desktop
        run: |
          tags=""
          if [ "$RUNNER_OS" = "Linux" ]; then tags="-tags webkit2_41"; fi
          wails build -clean -platform "${{ matrix.platform }}" $tags \
            -ldflags "-s -w -X main.version=$VERSION"

      # Optional signing and notarization. Without these secrets the app is
      # ad-hoc signed and macOS asks users to confirm the first launch.
      - name: sign and notarize (macos)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        working-directory: desktop/build/bin
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/sign.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain"
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" hrdx.app
          ditto -c -k --keepParent hrdx.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple hrdx.app
          rm notarize.zip

      - name: package (macos)
        if: runner.os == 'macOS'
        working-directory: desktop/build/bin
        run: |
          mkdir dmg
          cp -R hrdx.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "hrdx $VERSION" -srcfolder dmg -ov -format UDZO \
            "$GITHUB_WORKSPACE/hrdx-desktop_${VERSION}_macos_universal.dmg"

      - name: package (windows)
        if: runner.os == 'Windows'
        working-directory: desktop/build/bin
        shell: pwsh
        run: |
          Compress-Archive -Path hrdx-desktop.exe `
            -DestinationPath "$env:GITHUB_WORKSPACE/hrdx-desktop_${env:VERSION}_windows_amd64.zip"

      - name: package (linux)
        if: runner.os == 'Linux'
        working-directory: desktop/build/bin
        run: |
          tar -czf "$GITHUB_WORKSPACE/hrdx-desktop_${VERSION}_linux_amd64.tar.gz" hrdx-desktop

      - name: upload to release
        run: |
          for asset in hrdx-desktop_*; do
            sha256sum "$asset" 2>/dev/null || shasum -a 256 "$asset"
          done > "desktop-checksums-${{ matrix.name }}.txt"
          gh release upload "$TAG" hrdx-desktop_* "desktop-checksums-${{ matrix.name }}.txt" --clobber
